name: 価格を毎日更新

on:
  schedule:
    - cron: "13 21 * * *"   # 毎日 日本時間 6:13
  workflow_dispatch:         # 手動実行ボタン
  push:
    branches: [main]
    paths: [products.json, fetch_prices.py]   # 商品一覧や読み取り方を変えたらすぐ取り直す

concurrency:
  group: data-json
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 予約待ちの間に増えた変更も含めた最新から始める
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Amazon用ライブラリを入れる
        run: pip install "python-amazon-paapi==7.1.0"
      - name: 楽天・Yahoo!・Amazonから価格を取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          VC_SID: ${{ secrets.VC_SID }}
          VC_PID: ${{ secrets.VC_PID }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_API_VERSION: ${{ secrets.AMAZON_API_VERSION }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: python fetch_prices.py
      - name: data.json を保存
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json debug.json
          # 途中で他の変更が入っていても、data.json を文字単位で混ぜずに今回の結果で置き換える
          cp data.json /tmp/data.json; [ -f debug.json ] && cp debug.json /tmp/debug.json || true
          git fetch origin main
          git reset --hard origin/main   # 途中で入った他のファイルの変更を消さないよう、最新に合わせてから結果だけ載せる
          cp /tmp/data.json data.json; [ -f /tmp/debug.json ] && cp /tmp/debug.json debug.json || true
          git add data.json debug.json
          git diff --cached --quiet || git commit -m "価格を更新"
          git push origin HEAD:main
