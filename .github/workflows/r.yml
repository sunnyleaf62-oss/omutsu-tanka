name: 楽天の人気商品調べ（一時）
on:
  push:
    branches: [research-tmp]
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python r.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add out.json; git commit -m "結果"; git push
