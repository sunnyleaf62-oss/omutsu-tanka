name: お得情報を反映

on:
  push:
    branches: [main]
    paths: [deals.json]   # deals.json を更新したらすぐ反映
  schedule:
    - cron: "5 15 * * *"  # 毎日 日本時間 0:05（期限切れを消す・新しいお知らせを出す）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-json
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 予約待ちの間に増えた変更も含めた最新から始める
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: お得情報を data.json に反映
        env:
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python fetch_prices.py --deals-only
      - name: data.json を保存
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          # 途中で他の変更が入っていても、data.json を文字単位で混ぜずに今回の結果で置き換える
          cp data.json /tmp/data.json; [ -f debug.json ] && cp debug.json /tmp/debug.json || true
          git fetch origin main
          git reset --hard origin/main   # 途中で入った他のファイルの変更を消さないよう、最新に合わせてから結果だけ載せる
          cp /tmp/data.json data.json; [ -f /tmp/debug.json ] && cp /tmp/debug.json debug.json || true
          git add data.json
          git diff --cached --quiet || git commit -m "お得情報を反映"
          git push origin HEAD:main
