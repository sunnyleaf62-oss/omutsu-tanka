name: お得情報を反映

on:
  push:
    branches: [main]
    paths: [deals.json]   # deals.json を更新したらすぐ反映
  schedule:
    - cron: "5 15 * * *"  # 毎日 日本時間 0:05（期限切れを消す・新しいお知らせを出す）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-json
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: お得情報を data.json に反映
        env:
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python fetch_prices.py --deals-only
      - name: data.json を保存
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "お得情報を反映"
          git pull --rebase -X theirs origin main
          git push
